name: Docs

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse-dev libopus-dev

      - name: Build docs
        run: cargo doc --no-deps --document-private-items
        working-directory: pcmflux

      - name: Prepare site
        run: |
          touch pcmflux/target/doc/.nojekyll
          cat > pcmflux/target/doc/index.html << 'EOF'
          <!DOCTYPE html>
          <meta http-equiv="refresh" content="0; url=pcmflux/index.html">
          <a href="pcmflux/index.html">Redirecting...</a>
          EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pcmflux/target/doc
          keep_files: true
