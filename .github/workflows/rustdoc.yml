name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse-dev libopus-dev

      - name: Build docs
        run: cargo doc --no-deps --document-private-items
        working-directory: pcmflux

      - name: Prepare site
        # rustdoc writes the crate under its own directory and leaves a build
        # lock behind; the site root redirects into it and the lock is dropped.
        run: |
          rm -f pcmflux/target/doc/.lock
          cat > pcmflux/target/doc/index.html << 'EOF'
          <!DOCTYPE html>
          <meta http-equiv="refresh" content="0; url=pcmflux/index.html">
          <a href="pcmflux/index.html">Redirecting...</a>
          EOF

      - name: Upload rustdoc artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: pcmflux/target/doc
          retention-days: 1

  publish:
    name: Publish documentation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # deploy-pages resolves the artifact through the Actions API
      actions: read
      pages: write
      id-token: write
    if: ${{ github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
