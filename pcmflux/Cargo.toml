[package]
name = "pcmflux"
version = "2.1.0"
edition = "2024"
# let-chains (stable in edition 2024 since 1.88) are the newest language feature used.
rust-version = "1.88"

[lib]
name = "pcmflux"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
libpulse-binding = "2.30"
opusic-sys = "0.7"
bytemuck = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
