[package]
name = "pcmflux"
version = "2.1.0"
edition = "2024"

[lib]
name = "pcmflux"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
libpulse-binding = "2.30"
opus = "0.3"
audiopus_sys = "0.2"
bytemuck = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
